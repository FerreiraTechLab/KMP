name: Catalog contract

on:
  push:
    paths: ["catalog/**", "contract-examples/**", "reviews/**", "schemas/**", "tests/audit_package.py", "tools/audit-package.py", "tools/catalog-release.py", "tools/validate-catalog.py", "tools/validate-contract.py"]
  pull_request:
    paths: ["catalog/**", "contract-examples/**", "reviews/**", "schemas/**", "tests/audit_package.py", "tools/audit-package.py", "tools/catalog-release.py", "tools/validate-catalog.py", "tools/validate-contract.py"]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install check-jsonschema==0.33.3
      - run: check-jsonschema --check-metaschema schemas/*.schema.json
      - run: python3 tools/validate-catalog.py catalog/catalog-*.json contract-examples/catalog-v3.json
      - run: check-jsonschema --schemafile schemas/publisher-submission-v1.schema.json contract-examples/submission-v1.json
      - run: check-jsonschema --schemafile schemas/catalog-v3.schema.json contract-examples/catalog-v3.json
      - run: python3 tools/validate-contract.py submission contract-examples/submission-v1.json
      - run: python3 tools/validate-contract.py catalog contract-examples/catalog-v3.json
      - run: check-jsonschema --schemafile schemas/audit-report-v1.schema.json reviews/*/*.json
      - run: python3 tests/audit_package.py
